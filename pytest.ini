[pytest]
# The package sits at the repo root and is not installed into the venv.
# The pytest script does not put the cwd on sys.path (unlike `python -c`),
# so without this line every test fails with ModuleNotFoundError: misinfo_agent.
pythonpath = .
# Live tests call Gemini or Tavily. They stay out of the default run so a
# key in .env cannot be spent by `pytest`. `pytest -m live` overrides this.
addopts = -m "not live"
markers =
    live: calls the Gemini or Tavily API; run only with pytest -m live
